<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Department Employee Entry | Birla Corporation</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f0f5fc;font-family:Segoe UI,Arial,sans-serif;color:#1d3557}
header{background:linear-gradient(120deg,#123b70,#2478bd);color:white;padding:25px 5%}
header h1{margin:0;font-size:25px}
header p{margin:7px 0 0;color:#dbeafe}
main{max-width:1000px;margin:28px auto;padding:0 16px}
.card{background:white;border:1px solid #dce6f2;border-radius:14px;padding:25px;margin-bottom:20px;box-shadow:0 5px 20px #153c6510}
h2{font-size:19px;margin:0 0 22px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:7px}
input{width:100%;padding:12px;border:1px solid #cbd8e8;border-radius:8px;font-size:15px;background:#fbfdff}
input:focus{outline:2px solid #93c5fd;border-color:#3984d6}
.actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
button{border:0;border-radius:8px;padding:12px 20px;font-size:14px;font-weight:600;cursor:pointer}
.primary{background:#1769aa;color:white}.secondary{background:#e7eef7;color:#24415f}
#status{margin-top:16px;padding:12px;border-radius:8px;display:none;overflow-wrap:anywhere}
.ok{display:block!important;background:#e6f8ed;color:#17663a}
.err{display:block!important;background:#fff0f0;color:#a32121}
small{color:#60758e}
@media(max-width:650px){.grid{grid-template-columns:1fr}.card{padding:18px}}

/* ROYAL GOLD EDITION - visual layer only; business logic remains unchanged */
:root{--rg-bg:#071326;--rg-panel:#101f38;--rg-panel2:#142744;--rg-gold:#e8bd59;--rg-gold2:#fff0b2;--rg-text:#f8f3e5;--rg-muted:#c6cbd5;--rg-border:#8b6a2b}
html,body{scrollbar-color:#8b6a2b #081326}
body{background:radial-gradient(ellipse at top,#1b2d4a 0%,#071326 65%,#030812 100%)!important;color:var(--rg-text)!important}
header,.header{background:linear-gradient(115deg,#050b16,#102442 55%,#070d18)!important;border-bottom:3px solid var(--rg-gold)!important;color:#fff5d4!important;box-shadow:0 8px 28px #0008!important}
.title,.header-prize-no,.header-title,.total{color:var(--rg-gold2)!important}
button{border:1px solid #b88c36!important;border-radius:10px!important;box-shadow:0 5px 16px #0005, inset 0 1px #fff2!important;transition:transform .16s ease,filter .16s ease,box-shadow .16s ease!important}
button:hover{filter:brightness(1.15)!important;box-shadow:0 0 0 2px #e8bd5933,0 8px 22px #0008!important}
input,select,textarea{background:#08152a!important;color:#fff5d4!important;border:1px solid #8b6a2b!important;border-radius:8px!important}
input::placeholder,textarea::placeholder{color:#aeb9ca!important}
.action-bar,.top-bar,.table-container,main,.form-card,.panel,.card,.search-area{background:transparent!important;color:var(--rg-text)!important}
table{background:#0b1830!important;color:#f7f0dd!important;border-color:#554421!important}
th{background:linear-gradient(90deg,#6e501a,#bd913b,#72531a)!important;color:#fff5d4!important;border-color:#d2aa55!important}
td{border-color:#35445c!important;color:#f4ecd8!important}
tr:nth-child(even) td{background:#101f38!important}
.box,.winner-card,.employee-card{border-color:#d4a846!important;box-shadow:0 0 14px #d4a84620!important}
@keyframes rgGlow{0%,100%{box-shadow:0 0 10px #d8ad4b33, inset 0 0 0 1px #e8bd5944}50%{box-shadow:0 0 28px #f2ca65aa, inset 0 0 0 2px #ffecaa}}
@keyframes rgReveal{0%{transform:scale(.92);opacity:.45;filter:brightness(.7)}60%{transform:scale(1.025);opacity:1;filter:brightness(1.25)}100%{transform:scale(1);filter:brightness(1)}}
.selected,.winner,.box.selected,.box.winner{animation:rgGlow 1.25s ease-in-out infinite!important;border-color:#ffe6a0!important}
#winnerArea.show,#winnerArea[style*="display: block"],.winner-photo-box{animation:rgReveal .65s ease-out both}
.empty{color:#d0c6ad!important}
a{color:#f1cc70}

</style>
</head>
<body>
<header>
  <h1>BIRLA CORPORATION</h1>
  <p>Diwali Prize Management System · Department Employee Entry</p>
</header>
<main>
<section class="card">
  <h2>Employee Registration</h2>
  <form id="entryForm">
    <div class="grid">
      <div><label for="name">Employee Name *</label><input id="name" required maxlength="150"></div>
      <div><label for="employeeCode">Employee Code *</label><input id="employeeCode" required maxlength="50"></div>
      <div><label for="sapCode">SAP Code *</label><input id="sapCode" required maxlength="50"></div>
      <div><label for="couponNo">Coupon Number *</label><input id="couponNo" required maxlength="50"></div>
      <div><label for="couponHolderName">Coupon Holder Name *</label><input id="couponHolderName" required maxlength="150" placeholder="Enter coupon holder full name"></div>
      <div><label for="department">Department *</label><input id="department" required maxlength="100"></div>
      <div><label for="photo">Employee Photo</label><input id="photo" type="file" accept="image/*"><small>Optional · maximum 5 MB</small></div>
      <div><label>Photo Preview</label><img id="preview" alt="Photo preview" style="display:none;max-width:120px;max-height:120px;border-radius:8px"></div>
    </div>
    <div class="actions">
      <button class="primary" id="saveBtn" type="submit">Save Employee</button>
      <button class="secondary" type="reset">Clear Form</button>
    </div>
    <div id="status" role="status"></div>
  </form>
</section>
<section class="card">
  <h2>Saved Employees</h2>
  <p><small>List is loaded from the existing employee API, if available.</small></p>
  <div style="overflow-x:auto">
  <table style="width:100%;border-collapse:collapse;text-align:left">
    <thead><tr style="background:#edf4fc"><th style="padding:11px">Name</th><th>SAP Code</th><th>Coupon</th><th>Department</th></tr></thead>
    <tbody id="rows"><tr><td colspan="4" style="padding:12px">Loading...</td></tr></tbody>
  </table>
  </div>
</section>


</main>
<script>
const form=document.getElementById('entryForm');
const statusBox=document.getElementById('status');
const photoInput=document.getElementById('photo');
const preview=document.getElementById('preview');
let photoData='';
function status(message,error=false){
  statusBox.textContent=message;
  statusBox.className=error?'err':'ok';
}
photoInput.addEventListener('change',async()=>{
  photoData='';
  const file=photoInput.files[0];
  if(!file){preview.style.display='none';return;}
  if(file.size>5*1024*1024){photoInput.value='';status('Photo must be smaller than 5 MB.',true);return;}
  if(!file.type.startsWith('image/')){photoInput.value='';status('Please select an image.',true);return;}
  try{
    const data=await new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onload=()=>resolve(reader.result);
      reader.onerror=reject;
      reader.readAsDataURL(file);
    });
    photoData=data;
    preview.src=data;
    preview.style.display='block';
    status('Photo selected.');
  }catch(e){status('Photo could not be read.',true);}
});
form.addEventListener('reset',()=>{
  photoData='';
  preview.style.display='none';
  statusBox.style.display='none';
});
form.addEventListener('submit',async(e)=>{
  e.preventDefault();
  const btn=document.getElementById('saveBtn');
  btn.disabled=true;
  status('Saving employee...');
  try{
    const response=await fetch('/api/employees/manual-entry',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        name:document.getElementById('name').value.trim(),
        employeeCode:document.getElementById('employeeCode').value.trim(),
        sapCode:document.getElementById('sapCode').value.trim(),
        couponNo:document.getElementById('couponNo').value.trim(),
        couponHolderName:document.getElementById('couponHolderName').value.trim(),
        department:document.getElementById('department').value.trim(),
        photoData:photoData
      })
    });
    const result=await response.json();
    if(!response.ok||!result.success)throw new Error(result.message||('HTTP '+response.status));
    form.reset();
    status('Employee saved successfully.');
    loadEmployees();
  }catch(err){
    status('Save failed: '+err.message+'. The existing API may need checking.',true);
  }finally{btn.disabled=false;}
});
async function loadEmployees(){
  const rows=document.getElementById('rows');
  try{
    const response=await fetch('/api/employees/manual-entry');
    const result=await response.json();
    if(!response.ok||!result.success)throw new Error(result.message||'API unavailable');
    const employees=result.employees||[];
    rows.replaceChildren();
    if(!employees.length){
      rows.innerHTML='<tr><td colspan="4" style="padding:12px">No employees found.</td></tr>';
      return;
    }
    employees.forEach(e=>{
      const tr=document.createElement('tr');
      [e.name,e.sapCode,e.couponNo,e.department].forEach(value=>{
        const td=document.createElement('td');
        td.style.padding='11px';
        td.style.borderBottom='1px solid #e4edf6';
        td.textContent=value||'';
        tr.appendChild(td);
      });
      rows.appendChild(tr);
    });
  }catch(err){
    rows.innerHTML='<tr><td colspan="4" style="padding:12px">Employee list API unavailable. Form page is open; check the existing save/list API.</td></tr>';
  }
}
loadEmployees();

</script>

<script>
/* Royal Gold interaction sound layer. Sounds are synthesized locally; no audio downloads. */
(function(){
 let ctx;
 function tone(freq,duration,when,volume,type){try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.type=type||'sine';o.frequency.setValueAtTime(freq,ctx.currentTime+when);g.gain.setValueAtTime(0.0001,ctx.currentTime+when);g.gain.exponentialRampToValueAtTime(volume,ctx.currentTime+when+0.02);g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+when+duration);o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+when);o.stop(ctx.currentTime+when+duration+0.03);}catch(e){}}
 function clickSound(){tone(740,.07,0,.025,'triangle')}
 function winSound(){tone(523,.18,0,.06);tone(659,.2,.12,.055);tone(784,.26,.25,.055);tone(1047,.42,.4,.06)}
 document.addEventListener('click',function(e){if(e.target.closest('button'))clickSound()},true);
 window.RoyalGoldSound={click:clickSound,win:winSound};
 const winner=document.getElementById('winnerArea');
 if(winner&&window.MutationObserver){let last='';new MutationObserver(()=>{const now=(winner.innerText||'').trim();if(now&&now!==last&&/\S/.test(now)){last=now;winSound()}}).observe(winner,{subtree:true,childList:true,characterData:true,attributes:true});}
})();
</script>

</body>
</html>
