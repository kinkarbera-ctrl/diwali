<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0"
>

<title>
Birla Corporation - Diwali Prize
</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
}

body{

    font-family:
    Arial,
    Helvetica,
    sans-serif;

    overflow:hidden;

    background:
    radial-gradient(
        circle at top,
        #fffaf0 0%,
        #fff3d2 45%,
        #ffe5a5 100%
    );

    color:#3b2100;
}


/* ==========================================================
   HEADER
========================================================== */

.header{

    height:125px;

    display:grid;

    grid-template-columns:
        1fr
        auto
        1fr;

    align-items:center;

    padding:
        10px 32px;

    background:
    linear-gradient(
        90deg,
        #7c0000,
        #b20d00,
        #7c0000
    );

    border-bottom:
        4px solid #f2c14e;

    box-shadow:
        0 4px 15px #0004;

    color:white;
}

.brand{

    display:flex;

    align-items:center;

    gap:14px;
}

.diya{

    font-size:50px;

    line-height:1;

    filter:
    drop-shadow(
        0 0 8px #ffd34d
    );
}

.title{

    font-size:34px;

    font-weight:900;

    color:#ffe49a;
}

.company{

    margin-top:5px;

    font-size:14px;

    font-weight:900;

    letter-spacing:2px;
}

.header-prize{

    text-align:center;
}

.header-prize-label{

    font-size:14px;

    font-weight:900;

    color:#ffd76a;
}

.header-prize-no{

    margin-top:3px;

    font-size:46px;

    line-height:1;

    font-weight:900;

    color:white;
}

.header-actions{

    justify-self:end;

    display:flex;

    gap:10px;
}


/* ==========================================================
   BUTTONS
========================================================== */

button{

    border:0;

    border-radius:9px;

    min-height:48px;

    padding:
        0 17px;

    font-weight:900;

    color:white;

    cursor:pointer;

    box-shadow:
        0 3px 8px #0004;

    transition:
        transform .12s,
        filter .12s;
}

button:hover{

    filter:brightness(1.1);

    transform:
        translateY(-1px);
}

button:active{

    transform:
        translateY(1px);
}

.btn-display{

    background:
    linear-gradient(
        135deg,
        #703cc0,
        #482487
    );
}

.btn-settings{

    background:
    linear-gradient(
        135deg,
        #e0a617,
        #a96d00
    );
}

.btn-search{

    background:
    linear-gradient(
        135deg,
        #148b53,
        #075f37
    );
}

.btn-save{

    background:
    linear-gradient(
        135deg,
        #bb1729,
        #7b0715
    );
}

.btn-clear{

    background:
    linear-gradient(
        135deg,
        #e18c18,
        #bd5f00
    );
}

.btn-master{

    background:
    linear-gradient(
        135deg,
        #d49b13,
        #9d6800
    );
}

.btn-result{

    background:
    linear-gradient(
        135deg,
        #7148c1,
        #4b288f
    );
}


/* ==========================================================
   ACTION BAR
========================================================== */

.action-bar{

    height:82px;

    display:flex;

    align-items:center;

    gap:9px;

    padding:
        13px 25px;

    background:#fff;

    border-bottom:
        2px solid #e0bd63;
}

.search-area{

    flex:1;

    display:flex;

    gap:7px;
}

.search-input{

    flex:1;

    min-width:100px;

    height:50px;

    border:
        2px solid #cbb071;

    border-radius:9px;

    padding:
        0 15px;

    font-size:17px;

    outline:none;

    background:#fffdf7;
}

.search-input:focus{

    border-color:#bd8200;

    box-shadow:
        0 0 0 3px #e8b53130;
}


/* ==========================================================
   CONTENT
========================================================== */

.content{

    height:
        calc(
            100vh - 207px
        );

    display:grid;

    grid-template-columns:
        1fr
        1fr;

    gap:45px;

    padding:
        28px 50px;
}

.section-title{

    margin:
        0 0 18px;

    padding-bottom:
        10px;

    border-bottom:
        3px solid #a40000;

    color:#720000;

    font-size:24px;

    font-weight:900;
}

.employee-detail-cards{

    display:grid;

    grid-template-columns:1fr;

    gap:16px;

    margin-top:10px;
}

.detail-card{

    min-height:105px;

    padding:16px 22px;

    border-radius:16px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    box-shadow:
        0 6px 16px #0003,
        inset 0 0 18px #ffffff35;

    border:3px solid #ffffff70;

    position:relative;

    overflow:hidden;
}

.detail-card::after{

    content:"";

    position:absolute;

    width:120px;

    height:120px;

    right:-45px;

    top:-55px;

    border-radius:50%;

    background:#ffffff20;
}

.detail-label{

    font-size:14px;

    font-weight:900;

    letter-spacing:2px;

    color:white;

    margin-bottom:5px;
}

.detail-value{

    font-size:32px;

    line-height:1.1;

    font-weight:900;

    color:white;

    text-shadow:
        0 2px 4px #0005;

    word-break:break-word;
}

.name-card{

    background:
    linear-gradient(
        135deg,
        #a90000,
        #e34219,
        #ff8c00
    );
}

.sap-card{

    background:
    linear-gradient(
        135deg,
        #075b91,
        #0086b8,
        #00a6a6
    );
}

.prize-card{

    background:
    linear-gradient(
        135deg,
        #704000,
        #c78300,
        #f0b900
    );
}

@media(max-width:800px){

    .detail-card{
        min-height:90px;
    }

    .detail-value{
        font-size:25px;
    }
}


/* ==========================================================
   PHOTO
========================================================== */

.photo-section{

    display:flex;

    flex-direction:column;

    min-height:0;
}

.photo-name{

    text-align:center;

    font-size:20px;

    font-weight:900;

    color:#a40000;

    margin-bottom:8px;
}

.photo-box{

    flex:1;

    min-height:0;

    width:100%;

    max-height:calc(100vh - 340px);

    display:flex;

    align-items:center;

    justify-content:center;

    overflow:hidden;

    border:
        3px solid #d5a52e;

    border-radius:14px;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #fff4d5
        );

    box-shadow:
        inset 0 0 30px #d7a00022,
        0 4px 12px #0002;
}

.photo-box img{

    width:100%;

    height:100%;

    object-fit:contain;

    display:none;
}

.photo-placeholder{

    text-align:center;

    color:#b49a64;

    font-size:60px;
}

.photo-placeholder span{

    display:block;

    font-size:16px;

    font-weight:800;
}


/* ==========================================================
   MESSAGE
========================================================== */

.modal{

    position:fixed;

    inset:0;

    display:none;

    align-items:center;

    justify-content:center;

    background:#0008;

    z-index:10000;
}

.modal.show{
    display:flex;
}

.modal-box{

    width:440px;

    max-width:90%;

    padding:25px;

    border-radius:14px;

    background:#fffaf0;

    border:
        3px solid #d9a52b;

    box-shadow:
        0 15px 45px #0007;
}

.modal-box h2{

    margin-top:0;

    color:#950000;
}

.modal-box button{

    width:100%;

    margin-top:12px;
}

<script>

let currentEmployee = null;
let currentPrize = "10.10";

function message(title, text) {
    document.getElementById("messageTitle").textContent = title;
    document.getElementById("messageText").textContent = text;
    document.getElementById("messageModal").classList.add("show");
}

function setPrize(no) {
    currentPrize = no || "10.10";

    document.getElementById("headerPrize").textContent = currentPrize;
    document.getElementById("prizeValue").textContent = currentPrize;
}

async function loadCurrentPrize() {
    try {
        const response = await fetch("/api/current-prize");
        const data = await response.json();

        if (data.prizeNo === "COMPLETED") {
            setPrize("COMPLETED");
        } else {
            setPrize(data.prizeNo || "10.10");
        }
    } catch {
        setPrize("10.10");
    }
}

function clearEmployee() {
    currentEmployee = null;

    document.getElementById("couponSearch").value = "";

    document.getElementById("sapValue").textContent = "-";
    document.getElementById("nameValue").textContent = "-";
    document.getElementById("employeeName").textContent = "Employee Name";

    document.getElementById("employeePhoto").style.display = "none";
    document.getElementById("photoPlaceholder").style.display = "block";

    setPrize(currentPrize);
}

async function searchEmployee() {
    const value =
        document.getElementById("couponSearch").value.trim();

    if (!value) {
        message(
            "SEARCH",
            "Coupon No या SAP Code डालिए।"
        );
        return;
    }

    try {
        const response =
            await fetch(
                "/api/search/" +
                encodeURIComponent(value)
            );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.message);
        }

        currentEmployee = data.employee;

        const e = currentEmployee;

        document.getElementById("sapValue").textContent =
            e.sapCode || "-";

        document.getElementById("nameValue").textContent =
            e.name || "-";

        document.getElementById("prizeValue").textContent =
            currentPrize;

        document.getElementById("employeeName").textContent =
            e.name || "Employee Name";

        if (e.photo) {
            document.getElementById("employeePhoto").src = e.photo;
            document.getElementById("employeePhoto").style.display = "block";
            document.getElementById("photoPlaceholder").style.display = "none";
        } else {
            document.getElementById("employeePhoto").style.display = "none";
            document.getElementById("photoPlaceholder").style.display = "block";
        }

    } catch (error) {
        clearEmployee();

        message(
            "SEARCH ERROR",
            error.message || "Employee not found."
        );
    }
}

document.getElementById("searchBtn").addEventListener(
    "click",
    searchEmployee
);

document.getElementById("couponSearch").addEventListener(
    "keydown",
    e => {
        if (e.key === "Enter") {
            searchEmployee();
        }
    }
);

/* CLEAR HOME FORM ONLY */

document.getElementById("clearBtn").addEventListener(
    "click",
    clearEmployee
);

/* SAVE */

document.getElementById("saveBtn").addEventListener(
    "click",
    async () => {

        if (!currentEmployee) {
            message(
                "SAVE PRIZE",
                "पहले employee search कीजिए।"
            );
            return;
        }

        if (currentPrize === "COMPLETED") {
            message(
                "PRIZE COMPLETED",
                "सारे 55 prize save हो चुके हैं।"
            );
            return;
        }

        try {
            const response =
                await fetch(
                    "/api/prizes",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body: JSON.stringify({
                            prizeNo: currentPrize,
                            couponNo: currentEmployee.couponNo,
                            sapCode: currentEmployee.sapCode,
                            employeeName: currentEmployee.name,
                            department: currentEmployee.department,
                            designation: currentEmployee.designation,
                            unit: currentEmployee.unit,
                            photo: currentEmployee.photo
                        })
                    }
                );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.message);
            }

            clearEmployee();

            await loadCurrentPrize();

            message(
                "PRIZE SAVED",
                "Prize " +
                data.record.prizeNo +
                " successfully saved."
            );

        } catch (error) {
            message(
                "SAVE ERROR",
                error.message || "Save failed."
            );
        }
    }
);

/* DISPLAY */

document.getElementById("displayBtn").addEventListener(
    "click",
    () => {
        window.open(
            "/display.html",
            "_blank"
        );
    }
);

/* MASTER */

document.getElementById("masterBtn").addEventListener(
    "click",
    () => {
        window.open(
            "/master.html",
            "_blank"
        );
    }
);

/* DEPARTMENT EMPLOYEE ENTRY */

document.getElementById("departmentEntryBtn").addEventListener(
    "click",
    () => {
        window.open("/department-entry.html", "_blank");
    }
);

/* RESULT */

document.getElementById("resultBtn").addEventListener(
    "click",
    () => {
        window.open(
            "/result.html",
            "_blank"
        );
    }
);

/* SETTINGS */

document.getElementById("settingsBtn").addEventListener(
    "click",
    async () => {
        try {
            const r = await fetch("/api/health");
            const d = await r.json();

            message(
                "SETTINGS",
                d.message
            );
        } catch {
            message(
                "SETTINGS",
                "Server connection failed."
            );
        }
    }
);

document.getElementById("messageClose").addEventListener(
    "click",
    () => {
        document
            .getElementById("messageModal")
            .classList.remove("show");
    }
);

loadCurrentPrize();


loadCurrentPrize();

setInterval(
    loadCurrentPrize,
    3000
);

loadCurrentPrize();

setInterval(
    loadCurrentPrize,
    3000
);

/* INITIAL CURRENT PRIZE */
updateCurrentPrize();

/* AUTO REFRESH CURRENT PRIZE */
setInterval(
    updateCurrentPrize,
    2000
);
</script>

<script>
/* Royal Gold interaction sound layer. Sounds are synthesized locally; no audio downloads. */
(function(){
 let ctx;
 function tone(freq,duration,when,volume,type){try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.type=type||'sine';o.frequency.setValueAtTime(freq,ctx.currentTime+when);g.gain.setValueAtTime(0.0001,ctx.currentTime+when);g.gain.exponentialRampToValueAtTime(volume,ctx.currentTime+when+0.02);g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+when+duration);o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+when);o.stop(ctx.currentTime+when+duration+0.03);}catch(e){}}
 function clickSound(){tone(740,.07,0,.025,'triangle')}
 function winSound(){tone(523,.18,0,.06);tone(659,.2,.12,.055);tone(784,.26,.25,.055);tone(1047,.42,.4,.06)}
 document.addEventListener('click',function(e){if(e.target.closest('button'))clickSound()},true);
 window.RoyalGoldSound={click:clickSound,win:winSound};
 const winner=document.getElementById('winnerArea');
 if(winner&&window.MutationObserver){let last='';new MutationObserver(()=>{const now=(winner.innerText||'').trim();if(now&&now!==last&&/\S/.test(now)){last=now;winSound()}}).observe(winner,{subtree:true,childList:true,characterData:true,attributes:true});}
})();
</script>
