.table-container{

}

th,

    padding:40px;

/* ROYAL GOLD EDITION - visual layer only; business logic remains unchanged */
:root{--rg-bg:#071326;--rg-panel:#101f38;--rg-panel2:#142744;--rg-gold:#e8bd59;--rg-gold2:#fff0b2;--rg-text:#f8f3e5;--rg-muted:#c6cbd5;--rg-border:#8b6a2b}
html,body{scrollbar-color:#8b6a2b #081326}
body{background:radial-gradient(ellipse at top,#1b2d4a 0%,#071326 65%,#030812 100%)!important;color:var(--rg-text)!important}
header,.header{background:linear-gradient(115deg,#050b16,#102442 55%,#070d18)!important;border-bottom:3px solid var(--rg-gold)!important;color:#fff5d4!important;box-shadow:0 8px 28px #0008!important}
.title,.header-prize-no,.header-title,.total{color:var(--rg-gold2)!important}
button{border:1px solid #b88c36!important;border-radius:10px!important;box-shadow:0 5px 16px #0005, inset 0 1px #fff2!important;transition:transform .16s ease,filter .16s ease,box-shadow .16s ease!important}
button:hover{filter:brightness(1.15)!important;box-shadow:0 0 0 2px #e8bd5933,0 8px 22px #0008!important}
input,select,textarea{background:#08152a!important;color:#fff5d4!important;border:1px solid #8b6a2b!important;border-radius:8px!important}
input::placeholder,textarea::placeholder{color:#aeb9ca!important}
.action-bar,.top-bar,.table-container,main,.form-card,.panel,.card,.search-area{background:transparent!important;color:var(--rg-text)!important}
table{background:#0b1830!important;color:#f7f0dd!important;border-color:#554421!important}
th{background:linear-gradient(90deg,#6e501a,#bd913b,#72531a)!important;color:#fff5d4!important;border-color:#d2aa55!important}
td{border-color:#35445c!important;color:#f4ecd8!important}
tr:nth-child(even) td{background:#101f38!important}
.box,.winner-card,.employee-card{border-color:#d4a846!important;box-shadow:0 0 14px #d4a84620!important}
@keyframes rgGlow{0%,100%{box-shadow:0 0 10px #d8ad4b33, inset 0 0 0 1px #e8bd5944}50%{box-shadow:0 0 28px #f2ca65aa, inset 0 0 0 2px #ffecaa}}
@keyframes rgReveal{0%{transform:scale(.92);opacity:.45;filter:brightness(.7)}60%{transform:scale(1.025);opacity:1;filter:brightness(1.25)}100%{transform:scale(1);filter:brightness(1)}}
.selected,.winner,.box.selected,.box.winner{animation:rgGlow 1.25s ease-in-out infinite!important;border-color:#ffe6a0!important}
#winnerArea.show,#winnerArea[style*="display: block"],.winner-photo-box{animation:rgReveal .65s ease-out both}
.empty{color:#d0c6ad!important}
a{color:#f1cc70}

</style>

</head>

<body>

<header>

<div class="header-title">

<span>🏆</span>

<span>DIWALI PRIZE RESULT</span>

</div>

<div class="header-buttons">

<button
class="back"
onclick="goBack()"

>

⬅ BACK </button>

<button
class="clear-all"
onclick="clearAll()"

>

✖ CLEAR ALL </button>

</div>

</header>

<main>

<div class="top-bar">

<div
id="total"
class="total"
>
Total Winners: 0
</div>

</div>

<div class="table-container">

<table>

<thead>

<tr>

<th>
Prize No
</th>

<th>
Coupon No
</th>

<th>
SAP Code
</th>

<th>
Employee
</th>

<th>
Coupon Holder Name
</th>

<th>
Department
</th>

<th>
Designation
</th>

<th>
Unit
</th>

<th>
Date
</th>

<th>
Action
</th>

</tr>

</thead>

<tbody
id="result"
>

<tr>

<td
colspan="10"
class="empty"
>
Loading...
</td>

</tr>

</tbody>

</table>

</div>

</main>

<script>


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   LOAD RESULTS
   ===================================================== */

async function load(){

    try{

        const response =
            await fetch(
                "/api/prizes",
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "Failed to load prize results."
            );

        }


        const data =
            await response.json();


        const list =
            Array.isArray(data.prizes)
                ? data.prizes
                : [];


        document
            .getElementById("total")
            .textContent =
                "Total Winners: " +
                list.length;


        const result =
            document.getElementById(
                "result"
            );


        if(!list.length){

            result.innerHTML = `

                <tr>

                    <td
                        colspan="10"
                        class="empty"
                    >
                        No prize results available.
                    </td>

                </tr>

            `;

            return;

        }


        result.innerHTML =
            list.map(
                x => `

<tr>

<td>
<b>
${escapeHtml(x.prizeNo)}
</b>
</td>

<td>
${escapeHtml(x.couponNo)}
</td>

<td>
${escapeHtml(x.sapCode)}
</td>

<td>
${escapeHtml(x.employeeName)}
</td>

<td>
${escapeHtml(x.couponHolderName || x.accountHolderName || "-")}
</td>

<td>
${escapeHtml(x.department)}
</td>

<td>
${escapeHtml(x.designation)}
</td>

<td>
${escapeHtml(x.unit)}
</td>

<td>
${escapeHtml(x.date)}
</td>

<td>

<button
class="clear-one"
onclick="clearPrize('${encodeURIComponent(String(x.prizeNo || ""))}')"
>
CLEAR
</button>

</td>

</tr>

`
            )
            .join("");

    }
    catch(error){

        console.error(
            "RESULT LOAD ERROR:",
            error
        );


        document
            .getElementById("result")
            .innerHTML = `

                <tr>

                    <td
                        colspan="10"
                        class="empty"
                    >
                        Result load failed.
                    </td>

                </tr>

            `;

    }

}


/* =====================================================
   CLEAR ONE
   ===================================================== */

async function clearPrize(prize){

    if(!prize){

        return;

    }


    const prizeNo =
        decodeURIComponent(
            prize
        );


    const ok =
        confirm(
            "क्या Prize No " +
            prizeNo +
            " को clear करना चाहते हैं?"
        );


    if(!ok){

        return;

    }


    try{

        const response =
            await fetch(
                "/api/prizes/" +
                encodeURIComponent(
                    prizeNo
                ),
                {
                    method:"DELETE"
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            alert(
                data.message ||
                "Prize clear failed."
            );

            return;

        }


        alert(
            "Prize " +
            prizeNo +
            " cleared successfully."
        );


        await load();

    }
    catch(error){

        console.error(
            "CLEAR ONE ERROR:",
            error
        );


        alert(
            "Clear failed: " +
            error.message
        );

    }

}


/* =====================================================
   CLEAR ALL
   ===================================================== */

async function clearAll(){

    const ok =
        confirm(
            "WARNING!\n\n" +
            "क्या आप सभी prize results को एक साथ CLEAR करना चाहते हैं?\n\n" +
            "इससे सभी saved winners database से delete हो जाएंगे."
        );


    if(!ok){

        return;

    }


    try{

        const response =
            await fetch(
                "/api/prizes/clear-all",
                {
                    method:"DELETE",
                    headers:{
                        "Content-Type":
                            "application/json"
                    }
                }
            );


        const data =
            await response.json();


        console.log(
            "CLEAR ALL RESPONSE:",
            data
        );


        if(!response.ok){

            alert(
                data.message ||
                "Clear All failed."
            );

            return;

        }


        alert(
            "All prize results cleared successfully.\n\n" +
            "Deleted records: " +
            (
                data.deleted ??
                0
            )
        );


        await load();

    }
    catch(error){

        console.error(
            "CLEAR ALL ERROR:",
            error
        );


        alert(
            "Clear All failed:\n" +
            error.message
        );

    }

}


/* =====================================================
   BACK
   ===================================================== */

function goBack(){

    window.location.href = "/";

}


/* =====================================================
   START
   ===================================================== */

load();


/* Auto refresh */

setInterval(
    load,
    3000
);

</script>


<script>
/* Royal Gold interaction sound layer. Sounds are synthesized locally; no audio downloads. */
(function(){
 let ctx;
 function tone(freq,duration,when,volume,type){try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.type=type||'sine';o.frequency.setValueAtTime(freq,ctx.currentTime+when);g.gain.setValueAtTime(0.0001,ctx.currentTime+when);g.gain.exponentialRampToValueAtTime(volume,ctx.currentTime+when+0.02);g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+when+duration);o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+when);o.stop(ctx.currentTime+when+duration+0.03);}catch(e){}}
 function clickSound(){tone(740,.07,0,.025,'triangle')}
 function winSound(){tone(523,.18,0,.06);tone(659,.2,.12,.055);tone(784,.26,.25,.055);tone(1047,.42,.4,.06)}
 document.addEventListener('click',function(e){if(e.target.closest('button'))clickSound()},true);
 window.RoyalGoldSound={click:clickSound,win:winSound};
 const winner=document.getElementById('winnerArea');
 if(winner&&window.MutationObserver){let last='';new MutationObserver(()=>{const now=(winner.innerText||'').trim();if(now&&now!==last&&/\S/.test(now)){last=now;winSound()}}).observe(winner,{subtree:true,childList:true,characterData:true,attributes:true});}
})();
</script>

</body>

</html>
